# Alembic configuration file.
# Generated for NEXTAN Costing & Quote Generator backend.
# Owner: [Claude]

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Sys.path settings
prepend_sys_path = .

# Timezone to use when rendering the date within the migration file
# Leave blank for UTC
timezone = UTC

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a corresponding .py
# source file to be detected as revisions in the versions/ directory
# sourceless = false

# Version location specification; This defaults to alembic/versions.
# When using multiple version directories, initial revisions must be specified
# with --version-path.
version_locations = %(here)s/alembic/versions

# Version path separator; As mentioned above, this is the character used to
# split version_locations. The default within new alembic.ini files is "os",
# which uses os.pathsep. Note that this can conflict with reading.
# version_path_separator = os  # default: use os.pathsep

# The output encoding used when revision files are written from script.mako;
# defaults to utf-8.
output_encoding = utf-8

# Database URL is read from environment in env.py — not set here.
sqlalchemy.url =

[post_write_hooks]
# Post-write hooks define scripts or Python functions that are run on newly
# generated revision scripts. See the documentation for further detail.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
